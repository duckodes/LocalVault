<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>密碼庫自動填入</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">🔒</div>
      <div>
        <h1>密碼庫</h1>
        <p id="site">正在確認目前網站…</p>
      </div>
    </header>
    <p id="status" class="status" role="status">尚未連線主程式；只有按下按鈕後才會開啟登入選擇。</p>
    <section id="actions" class="actions" aria-label="登入操作"></section>
    <footer>登入資料不會預先傳到擴充套件；只有在主程式選定後，才傳送該筆資料填入目前網站。</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
